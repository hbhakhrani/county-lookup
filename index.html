<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>County Lookup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 36px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 5px;
    }

    .field { margin-bottom: 16px; }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #111;
      transition: border-color 0.15s;
      outline: none;
    }

    input:focus { border-color: #4f46e5; }
    input.invalid { border-color: #f87171; }

    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }

    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .hint {
      font-size: 0.78rem;
      color: #999;
      margin-top: 6px;
    }

    .result {
      margin-top: 24px;
      padding: 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
    }

    .result.success {
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      color: #166534;
    }

    .result.error {
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      color: #991b1b;
    }

    .result.no-match {
      background: #fffbeb;
      border: 1.5px solid #fcd34d;
      color: #92400e;
    }

    .county-name {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .matched-address {
      font-size: 0.8rem;
      opacity: 0.75;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>County Lookup</h1>
    <p class="subtitle">Find which US county an address is in, via the Census Bureau.</p>

    <div class="field">
      <label for="address">Full address</label>
      <input
        id="address"
        type="text"
        placeholder="21523 Santa Clara Dr, Katy, TX 77450"
        autocomplete="street-address"
      />
      <p class="hint">e.g. <em>123 Main St, Houston, TX 77001</em></p>
    </div>

    <button id="btn" onclick="lookup()">Look up county</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    document.getElementById('address').addEventListener('keydown', e => {
      if (e.key === 'Enter') lookup();
    });

    // Census API has no CORS headers — JSONP is their official browser workaround.
    // Dynamically injects a <script> tag; Census calls our named callback with the data.
    function censusJsonp(address) {
      return new Promise((resolve, reject) => {
        const cbName = '__censusCallback_' + Date.now();
        const params = new URLSearchParams({
          address:   address,
          benchmark: 'Public_AR_Current',
          vintage:   'Current_Current',
          format:    'jsonp',
          callback:  cbName,
        });

        const jsonpUrl = `https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress?${params}`;
        // JSON link for the "Census API response" button — swap out JSONP params
        const jsonUrl = `https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress?address=${encodeURIComponent(address)}&benchmark=Public_AR_Current&vintage=Current_Current`;

        const script = document.createElement('script');
        const timer  = setTimeout(() => {
          cleanup();
          reject(new Error('Request timed out after 12s'));
        }, 12000);

        window[cbName] = (data) => { cleanup(); resolve({ data, jsonUrl }); };

        function cleanup() {
          clearTimeout(timer);
          delete window[cbName];
          script.remove();
        }

        script.onerror = () => { cleanup(); reject(new Error('Failed to reach Census API')); };
        script.src = jsonpUrl;
        document.head.appendChild(script);
      });
    }

    async function lookup() {
      const input  = document.getElementById('address');
      const btn    = document.getElementById('btn');
      const result = document.getElementById('result');
      const raw    = input.value.trim();

      result.style.display = 'none';
      input.classList.remove('invalid');

      if (!raw) {
        input.classList.add('invalid');
        flash('Please enter an address.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Looking up…';

      try {
        const { data, jsonUrl } = await censusJsonp(raw);
        const matches = data?.result?.addressMatches;

        if (!matches || matches.length === 0) {
          flash('No match found. Double-check the spelling or try including the ZIP code.', 'no-match');
          return;
        }

        const match    = matches[0];
        const counties = match.geographies?.Counties;
        if (!counties || counties.length === 0) {
          flash('Address matched but county data was not returned.', 'no-match');
          return;
        }

        result.className = 'result success';
        result.innerHTML =
          '<div class="county-name">' + counties[0].NAME + '</div>' +
          '<div class="matched-address">Matched: ' + match.matchedAddress + '</div>' +
          '<div class="matched-address" style="margin-top:10px">' +
          '<a href="' + jsonUrl + '" target="_blank" rel="noopener" style="color:#166534;word-break:break-all;">Census API response ↗</a>' +
          '</div>';
        result.style.display = 'block';

      } catch (err) {
        flash('Error: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Look up county';
      }
    }

    function flash(msg, type) {
      const result = document.getElementById('result');
      result.className = 'result ' + type;
      result.textContent = msg;
      result.style.display = 'block';
    }
  </script>
</body>
</html>
